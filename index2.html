<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo</title>

    <style>
        /* Fondo con gradiente profundo y tipografía limpia */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #1e1b4b, #0f172a, #020617);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Título con gradiente llamativo y animación de flotado */
        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(129, 140, 248, 0.4);
            animation: flotar 3.5s ease-in-out infinite;
        }

        /* Contenedor central con espacio y alineación */
        center {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 90%;
            max-width: 440px;
        }

        /* Botones con paleta viva, bordes glow y transiciones suaves */
        .boton {
            position: relative;
            display: inline-block;
            padding: 16px 30px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            background-size: 200% 200%;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            text-align: center;
        }

        /* Efecto de destello de luz al pasar el cursor */
        .boton::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.5s;
        }

        .boton:hover::before {
            left: 100%;
        }

        /* Animación Hover: elevación, cambio de gradiente y brillo */
        .boton:hover {
            transform: translateY(-5px) scale(1.03);
            background-position: right center;
            box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.65), 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Efecto al hacer clic */
        .boton:active {
            transform: translateY(-1px) scale(0.99);
        }

        /* Keyframes para la animación flotante del título */
        @keyframes flotar {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>
